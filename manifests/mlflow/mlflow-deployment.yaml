apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v3.16.1
          command: ["/bin/bash", "-c"]
          args:
            - |
              pip install --no-cache-dir psycopg2-binary boto3 && \
              exec mlflow server \
                --host 0.0.0.0 \
                --port 5000 \
                --backend-store-uri postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/mlflow \
                --artifacts-destination s3://$(S3_BUCKET) \
                --serve-artifacts \
                --allowed-hosts "main-node.$(TAILNET_DOMAIN),main-node.$(TAILNET_DOMAIN):*,mlflow.$(PROJ_SERVER_DOMAIN)"
                --cors-allowed-origins "https://mlflow.$(PROJ_SERVER_DOMAIN)"
          ports:
            - containerPort: 5000
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: mlflow-secrets, key: postgres-user }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: mlflow-secrets, key: postgres-password }
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: mlflow-secrets, key: s3-access-key }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: mlflow-secrets, key: s3-secret-key }
            - name: MLFLOW_S3_ENDPOINT_URL
              value: "https://fsn1.your-objectstorage.com"
            - name: AWS_DEFAULT_REGION
              value: "eu-central-1"
            - name: S3_BUCKET
              value: "markritis-haw-project"
            - name: TAILNET_DOMAIN
              valueFrom:
                configMapKeyRef: { name: mlflow-domains, key: tailnet-domain }
            - name: PROJ_SERVER_DOMAIN
              valueFrom:
                configMapKeyRef: { name: mlflow-domains, key: proj-server-domain }
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: mlflow
spec:
  selector:
    app: mlflow
  ports:
    - port: 5000
      targetPort: 5000